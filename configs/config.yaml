defaults:
  - data: smard
  - model: mlp
  - optim: adamw
  - trainer: default
  - _self_

project_name: EnergyPriceMLOps
seed: 42
target: day_ahead_price_eur_mwh

paths:
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed
  artifacts_dir: artifacts

tracking:
  provider: csv
  entity: null
  project: EnergyPriceMLOps
  mode: offline

training:
  run_name: ${model.name}
  batch_size: 128
  num_workers: 0
  early_stopping_patience: 10
  monitor_metric: val_mae
  monitor_mode: min
